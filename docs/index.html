<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to https://docs.secondfactor.ai</title>
<meta http-equiv="refresh" content="0; url=https://docs.secondfactor.ai/">
<link rel="canonical" href="https://docs.secondfactor.ai/">
<meta name="robots" content="noindex">
<script>
/* Map old in-page anchors to the matching pages on the docs site. */
(function () {
  var map = { '#send': '/send-otp', '#check': '/check-otp', '#fetch': '/get-verification', '#webhooks': '/webhooks', '#polling': '/get-verification' };
  var dest = 'https://docs.secondfactor.ai' + (map[location.hash] || '/');
  window.location.replace(dest);
})();
</script>
</head>
<body>
<p>The API documentation has moved to <a href="https://docs.secondfactor.ai/">docs.secondfactor.ai</a>.</p>
</body>
</html>
